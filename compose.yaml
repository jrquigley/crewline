services:
  crewline:
    build: .
    image: crewline:local
    container_name: crewline
    restart: unless-stopped
    init: true
    env_file: .env
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    volumes:
      - crewline_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  crewline_data:
