nd)}</div>`).join('')||'<p class="cl-small cl-muted" style="margin-top:8px">No availability restrictions submitted.</p>'}${req.map(q=>`<div class="cl-row cl-small">${dateLabel(q.from)}${q.from!==q.to?'–'+dateLabel(q.to):''}${badge(q.status,q.status==='Pending'?'warn':'neutral')}</div>`).join('')}</div><div class="cl-surface"><h3>Employment & records</h3><p class="cl-small cl-muted" style="margin:8px 0 13px">${p.status==='Active'?'End employment, revoke access, and reopen future assignments. Historical records stay attached to this employee.':esc(p.notes||'Employment ended. Historical records retained.')}</p>${p.status==='Active'?button('End employment…','termination','','data-id="'+p.id+'"'):badge('Retained record · sign-in disabled','bad')}${ui.edit==='terminate'?`<div class="cl-inlineform"><strong class="cl-small">End ${esc(p.name)}’s employment now?</strong><p class="cl-small">${ss.length} future shifts will reopen. Website sessions, invitations, email delivery, and calendar subscription access must be revoked together.</p>${button('End employment & revoke access','confirm-termination','cl-danger','data-id="'+p.id+'"')}${button('Cancel','cancel-edit')}</div>`:''}</div></div></div><div class="cl-surface"><h3>Historical shifts · retained</h3>${data.history.filter(x=>x.staff===p.id).map(x=>`<div class="cl-row"><div><strong class="cl-small">${esc(x.name)}</strong><p class="cl-small cl-muted">${dateLabel(x.date)} · ${range(x)} · ${esc(x.location)}</p></div><strong class="cl-small">${hfmt((x.end-x.start)/60)}h</strong></div>`).join('')||empty('No historical shifts in this sample record.')}</div><div class="cl-surface"><h3>Record history</h3><div class="cl-activity" style="margin-top:13px"><div><strong>Oct 23, 2026</strong><br>Prior scheduling records retained separately from future assignments.</div>${data.audit.filter(a=>a.text.includes(p.name)).map(a=>`<div><strong>${esc(a.at)}</strong><br>${esc(a.text)}</div>`).join('')||'<div class="cl-muted">No new changes in this preview.</div>'}</div></div>`;}
function requests(){return `${header('Requests','Time off and open-shift requests, in one place.')}<div class="cl-surface"><h3>Time off</h3>${data.requests.filter(q=>q.kind!=='shift').map(q=>{const p=person(q.staff),conf=data.shifts.filter(s=>s.staff===q.staff&&event(s.event).date>=q.from&&event(s.event).date<=q.to);return `<div class="cl-row"><div class="cl-flex">${avatar(p)}<div><strong>${esc(p.name)}</strong><p class="cl-small cl-muted">${dateLabel(q.from)}${q.to!==q.from?' – '+dateLabel(q.to):''} · ${esc(q.note||'Time off')}</p>${conf.length&&q.status==='Pending'?`<p class="cl-small" style="color:var(--cl-warn)">${conf.length} assigned shift${conf.length>1?'s':''} will reopen if approved.</p>`:''}</div></div><div class="cl-flex">${q.status==='Pending'?button('Decline','decline-request','','data-id="'+q.id+'"')+button('Approve','approve-request','cl-primary','data-id="'+q.id+'"'):badge(q.status,q.status==='Approved'?'':'neutral')}</div></div>`}).join('')||empty('No time-off requests.')}</div><div class="cl-surface"><h3>Open-shift requests</h3>${data.requests.filter(q=>q.kind==='shift').map(q=>{const s=data.shifts.find(s=>s.id===q.shift),p=person(q.staff),e=event(s.event);return `<div class="cl-row"><div><strong>${esc(p.name)}</strong><p class="cl-small cl-muted">${esc(e.name)} · ${dateLabel(e.date)} · ${range(s)}</p></div><div class="cl-flex">${q.status==='Pending'?button('Decline','decline-request','','data-id="'+q.id+'"')+button('Approve','approve-claim','cl-primary','data-id="'+q.id+'"'):badge(q.status)}</div></div>`}).join('')||empty('Staff requests for available shifts will appear here.')}</div>`;}
function settings(){return `${header('Rules & settings','One set of safeguards across departments and locations.')}<form class="cl-stack" data-form="settings"><section class="cl-surface cl-stack"><h3>Event coverage rules</h3><div class="cl-formgrid"><label class="cl-field">Pre-event coverage · minutes<input type="number" name="pre" min="0" max="240" step="5" value="${data.rules.pre}" required></label><label class="cl-field">Post-event coverage · minutes<input type="number" name="post" min="0" max="240" step="5" value="${data.rules.post}" required></label><label class="cl-field">Handover overlap · minutes<input type="number" name="handover" min="0" max="60" step="5" value="${data.rules.handover}" required></label><label class="cl-field">Travel between locations · minutes<input type="number" name="travel" min="0" max="180" step="5" value="${data.rules.travel}" required></label></div><label class="cl-check"><input type="checkbox" name="overlap" ${data.rules.overlap?'checked':''}>Block double-booking across all departments and locations</label><p class="cl-small cl-muted">Handover overlap is coverage by different staff. Changing these rules flags existing coverage gaps; it does not silently change published shifts.</p></section><section class="cl-surface cl-stack"><h3>Email notifications</h3><label class="cl-check"><input type="checkbox" name="updates" ${data.notifications.updates?'checked':''}>Email affected staff when their published shift changes</label><label class="cl-check"><input type="checkbox" name="digest" ${data.notifications.digest?'checked':''}>Send a weekly email of the upcoming schedule</label><div class="cl-formgrid"><label class="cl-field">Weekly email day<select name="day">${options(['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],data.notifications.day)}</select></label><label class="cl-field">Send time · Pacific<input type="time" name="time" value="${data.notifications.time}" required></label></div>${button('Preview weekly email','preview-digest')}</section><section class="cl-surface cl-stack"><h3>Staff schedule visibility</h3><label class="cl-check"><input type="checkbox" name="coworkers" ${data.notifications.coworkers?'checked':''}>Let staff see coworkers’ names and shifts at their assigned locations</label><p class="cl-small cl-muted">Personal contact details, time-off reasons, and employment records stay private.</p></section><div class="cl-formerror" role="alert"></div><div>${button('Save settings','submit','cl-primary')}</div></form><div class="cl-split"><section class="cl-surface"><h3>Departments</h3>${data.departments.map(d=>`<div class="cl-row cl-small">${esc(d)}</div>`).join('')}<form class="cl-inlineform" data-form="department"><label class="cl-field">New department<input name="name" required placeholder="e.g. Security"></label>${button('Add department','submit')}</form></section><section class="cl-surface"><h3>Locations</h3>${data.locations.map(d=>`<div class="cl-row cl-small">${esc(d)}</div>`).join('')}<form class="cl-inlineform" data-form="location"><label class="cl-field">New location<input name="name" required placeholder="e.g. West Annex"></label>${button('Add location','submit')}</form></section></div>`;}
function modules(){return `${header('Modules','Add context without making staff screens more complicated.')}<section class="cl-surface cl-stack"><div class="cl-flex cl-between"><div class="cl-flex">${icon('calendar-plus')}<h3>External events</h3></div>${badge(data.external?'Preview enabled':'Optional','neutral')}</div><p class="cl-muted">Show concerts, conferences, and nearby events next to your staffing plan to anticipate coverage needs.</p><div class="cl-note">${icon('layers')}External events are context. They only become staffed Events when a manager creates coverage.</div><div>${button(data.external?'Hide sample external event':'Show sample external event','toggle-external','cl-primary')}</div><p class="cl-small cl-muted">Preview source: City events calendar · read-only · Sample event data</p></section><section class="cl-surface cl-stack"><h3>Personal calendars</h3><p class="cl-muted">Staff choose Google Calendar, iPhone / Apple Calendar, Android, or Outlook from their own account. Only their published shifts are included.</p><div class="cl-flex">${badge('Private subscription','neutral')}${badge('One-time event export','neutral')}</div></section><section class="cl-surface"><h3>Designed for more</h3><div class="cl-row"><span>Payroll & time tracking</span>${badge('Future module','neutral')}</div><div class="cl-row"><span>Credentials & certification expiry</span>${badge('Future module','neutral')}</div><div class="cl-row"><span>Advanced demand forecasting</span>${badge('Future module','neutral')}</div></section>`;}
function newEvent(){return `${back()}${header('New Event','Build coverage around an event. Nothing repeats unless you choose it.')}<form data-form="event" class="cl-surface cl-stack"><div class="cl-formgrid"><label class="cl-field cl-full">Event name<input name="name" required placeholder="e.g. Winter fundraiser" maxlength="80"></label><label class="cl-field">Date<input name="date" type="date" value="2026-11-08" min="2026-11-02" max="2026-11-08" required></label><label class="cl-field">Location<select name="location">${options(data.locations,data.locations[0])}</select></label><label class="cl-field">Event starts<input name="start" type="time" value="18:00" required></label><label class="cl-field">Event ends<input name="end" type="time" value="21:00" required></label><label class="cl-field">Department<select name="dept">${options(data.departments,data.departments[0])}</select></label><label class="cl-field">Required skill<input name="skill" value="Guest welcome" required></label></div><div class="cl-note">${icon('sparkles')}Creates 3 open shifts: pre-event (${data.rules.pre}m), during the event, and post-event (${data.rules.post}m), with ${data.rules.handover}m handovers.</div><p class="cl-small cl-muted">This preview is scoped to Nov 2–8. Staff are assigned after you create the Event.</p><div class="cl-formerror" role="alert"></div><div>${button('Create Event & coverage','submit','cl-primary')}</div></form>`;}
function newStaff(){return `${back()}${header('Add staff','Create a staff record before inviting them to sign in.')}<form class="cl-surface cl-stack" data-form="newstaff"><div class="cl-formgrid"><label class="cl-field">Full name<input name="name" required maxlength="60"></label><label class="cl-field">Email<input name="email" type="email" required></label><label class="cl-field">Phone<input name="phone" type="tel"></label><label class="cl-field">Department<select name="dept">${options(data.departments,data.departments[0])}</select></label><label class="cl-field cl-full">Skills · separate with commas<input name="skills" required placeholder="Guest welcome, First aid"></label></div><div class="cl-field">Locations<div class="cl-checks">${data.locations.map(l=>`<label class="cl-check"><input type="checkbox" name="locations" value="${esc(l)}">${esc(l)}</label>`).join('')}</div></div><div class="cl-formerror" role="alert"></div><div>${button('Create staff record','submit','cl-primary')}</div><p class="cl-small cl-muted">No invitation is sent from this interface preview.</p></form>`;}
function publishPage(){let p=person('alex'),ss=(ui.emailType==='digest'?data.publishedShifts:data.shifts).filter(s=>s.staff===p.id),warn=data.events.reduce((n,e)=>n+issues(e).length,0);const weekly=ui.emailType==='digest';return `${back()}${header(weekly?'Weekly email preview':'Publish & notify',weekly?`${data.notifications.day}s at ${time(mins(data.notifications.time))} · Pacific time`:'Review coverage and the email staff will receive.')}<div class="cl-publish cl-stack"><div class="cl-note ${warn?'warn':''}">${icon(warn?'triangle-alert':'check')}${warn?`${warn} rule issue${warn>1?'s':''} must be resolved before publishing.`:'All assignment and coverage rules pass.'} ${data.shifts.filter(s=>!s.staff).length} shifts remain open.</div><div class="cl-email"><div class="cl-small cl-muted">EMAIL PREVIEW · ${esc(p.email)}</div><h3>${weekly?'Your upcoming schedule':'Your schedule has been updated'}</h3><p>Hi ${esc(p.name.split(' ')[0])},</p><p>${weekly?'Here is your schedule for Nov 2–8.':'Your upcoming schedule is ready. Check your shifts below.'}</p>${ss.map(s=>`<div class="cl-eventstripe"><strong>${esc(event(s.event).name)}</strong><br>${dateLabel(event(s.event).date)} · ${range(s)}<br><span class="cl-muted">${esc(event(s.event).location)}</span></div>`).join('')}<div>${button('View my schedule','email-staff','cl-primary')}</div><p class="cl-small cl-muted">The website always shows the latest schedule. Calendar apps may take time to refresh.</p></div>${!weekly?button('Publish schedule · preview only','confirm-publish','cl-primary',warn?'disabled':''):''}<p class="cl-small cl-muted">Sample email only. This preview does not send email or run a weekly delivery job.</p>${data.outbox.length?`<div class="cl-surface"><h3>Preview notification log</h3>${data.outbox.map(o=>`<div class="cl-row cl-small">${esc(o)}</div>`).join('')}</div>`:''}</div>`;}
function staff(){const p=person(ui.staffId);return `<div class="cl-flex cl-between" style="margin:0 0 12px"><span class="cl-muted cl-small">Simple staff experience · phone browser</span><label class="cl-previewuser">Preview as<select data-filter="staffId">${data.staff.map(x=>`<option value="${x.id}" ${ui.staffId===x.id?'selected':''}>${esc(x.name)}${x.status!=='Active'?' · access revoked':''}</option>`).join('')}</select></label></div><div class="cl-phone-stage"><div class="cl-phone"><div class="cl-phone-top"><div class="cl-brand">${mark}crewline</div>${avatar(p)}</div><main class="cl-phonecontent">${p.status!=='Active'?`<div class="cl-stack"><div>${icon('lock-keyhole')}</div><h1>Access ended</h1><p class="cl-muted">Your staff account is no longer active. Contact your manager if you need help.</p><p class="cl-small cl-muted">Personal calendars and sign-in are disabled. Your employment records remain with your organization.</p></div>`:staffPage(p)}</main>${p.status==='Active'?`<nav class="cl-mobile-nav" aria-label="Staff">${[['home','house','Home'],['schedule','calendar-days','Schedule'],['me','circle-user-round','Me']].map(([k,i,l])=>`<button type="button" data-staffpage="${k}" aria-current="${ui.staffPage===k?'page':'false'}">${icon(i)}${l}</button>`).join('')}</nav>`:''}</div></div>`;}
function staffPage(p){if(ui.staffPage==='home')return staffHome(p);if(ui.staffPage==='schedule')return staffSchedule(p);if(ui.staffPage==='timeoff')return timeoff(p);if(ui.staffPage==='availability')return availability(p);if(ui.staffPage==='calendar')return calendarPage(p);if(ui.staffPage==='open')return staffOpen(p);if(ui.staffPage==='shift')return staffShift(p);if(ui.staffPage==='details')return myDetails(p);if(ui.staffPage==='coworkers')return coworkers(p);return me(p);}
function staffHome(p){const ss=myShifts(),s=ss[0],e=s?publishedEvent(s.event):null;return `<div><p class="cl-kicker" style="margin-bottom:6px">Wednesday, November 4</p><h1>Hi, ${esc(p.name.split(' ')[0])}.</h1><p class="cl-muted" style="margin-top:5px">Here’s what’s coming up.</p></div>${s?`<section class="cl-nextshift"><div class="cl-flex cl-between"><span class="cl-kicker">Your next shift</span>${icon('arrow-up-right')}</div><div><p>${dateLabel(e.date)}</p><h2 style="margin-top:4px">${range(s)}</h2></div><div><strong>${esc(e.name)}</strong><p style="margin-top:4px;opacity:.85">${esc(e.location)} · ${esc(shiftDept(s))}</p></div>${button('View shift','staff-shift','','data-id="'+s.id+'"')}</section>`:`<div class="cl-phonecard" style="padding:22px"><h2>No shifts yet</h2><p class="cl-muted" style="margin-top:6px">Your next shift will appear here.</p></div>`}<div class="cl-quick"><button type="button" data-staffpage="timeoff">${icon('sun')}Request time off</button><button type="button" data-staffpage="open">${icon('hand')}Pick up a shift</button></div><section><div class="cl-flex cl-between" style="margin-bottom:10px"><h2>Coming up</h2><button type="button" class="cl-link" data-staffpage="schedule">See all</button></div><div class="cl-phonecard">${ss.slice(0,3).map(s=>staffShiftRow(s)).join('')||empty('No upcoming shifts.')}</div></section><button type="button" class="cl-link cl-icon" data-staffpage="coworkers">${icon('users')}View team schedule</button>`;}
function staffShiftRow(s){const e=publishedEvent(s.event);return `<button type="button" class="cl-listbutton" data-act="staff-shift" data-id="${s.id}"><div class="cl-flex" style="flex-wrap:nowrap"><span class="cl-datebox">${dateLabel(e.date,{weekday:'short'}).toUpperCase()}<b>${Number(e.date.slice(-2))}</b></span><span><strong style="font-size:13px">${range(s)}</strong><br><span class="cl-small cl-muted">${esc(e.name)}<br>${esc(e.location)}</span></span></div>${icon('chevron-right')}</button>`;}
function staffSchedule(p){const ss=myShifts();return `<div><h1>My schedule</h1><p class="cl-muted" style="margin-top:6px">Nov 2–8 · Pacific time</p></div><div class="cl-phonecard">${ss.map(staffShiftRow).join('')||empty('No shifts scheduled.')}</div>${button(icon('calendar-plus')+'Add to my calendar','staff-calendar')}${data.notifications.coworkers?button(icon('users')+'Full schedule & coworkers','staff-coworkers'):''}<p class="cl-small cl-muted">${ss.length} shifts · ${hfmt(publishedHours(p))} hours this week</p>`;}
function staffShift(p){const s=data.publishedShifts.find(s=>s.id===ui.detail?.id);if(!s||s.staff!==p.id)return `${staffBack()}${empty('This shift is no longer assigned to you.')}`;const e=publishedEvent(s.event),cow=data.publishedShifts.filter(x=>x.event===e.id&&x.staff&&x.staff!==p.id&&person(x.staff).status==='Active');return `${staffBack('schedule')}<div><p class="cl-kicker">${dateLabel(e.date)}</p><h1 style="margin-top:8px">${range(s)}</h1><p class="cl-muted" style="margin-top:8px">${hfmt((s.end-s.start)/60)} hour shift</p></div><div class="cl-phonecard" style="padding:19px"><h2>${esc(e.name)}</h2><div class="cl-row">${icon('map-pin')}<div>${esc(e.location)}<br><span class="cl-small cl-muted">${esc(shiftDept(s))}</span></div></div><div class="cl-row"><span>Role</span><strong>${esc(shiftSkill(s))}</strong></div><div class="cl-row"><span>Coverage</span>${badge(s.phase==='pre'?'Before event':s.phase==='post'?'After event':'During event')}</div></div>${data.notifications.coworkers?`<section><h2 style="margin-bottom:10px">Working with you</h2><div class="cl-phonecard">${[...new Set(cow.map(x=>x.staff))].map(id=>`<div class="cl-row"><div class="cl-flex">${avatar(person(id))}${esc(person(id).name)}</div></div>`).join('')||empty('Team assignments are still being filled.')}</div></section>`:''}${button(icon('calendar-plus')+'Add to calendar','staff-calendar')}`;}
function staffBack(page='home'){return `<button type="button" class="cl-back" data-staffpage="${page}">${icon('arrow-left')}Back</button>`;}
function timeoff(p){const qs=data.requests.filter(q=>q.staff===p.id&&q.kind!=='shift');return `${staffBack()}<div><h1>Time off</h1><p class="cl-muted" style="margin-top:7px">Tell us when you can’t work.</p></div><form class="cl-stack" data-form="timeoff"><label class="cl-field">First day<input name="from" type="date" min="2026-11-04" value="2026-11-08" required></label><label class="cl-field">Last day<input name="to" type="date" min="2026-11-04" value="2026-11-08" required></label><label class="cl-field">Note for your manager · optional<textarea name="note" rows="2" placeholder="Anything we should know?" maxlength="250"></textarea></label><div class="cl-formerror" role="alert"></div>${button('Send request','submit','cl-primary')}<p class="cl-small cl-muted">Your manager will review it. Assigned shifts stay on your schedule until approved.</p></form>${qs.length?`<section><h2 style="margin-bottom:10px">My requests</h2><div class="cl-phonecard">${qs.map(q=>`<div class="cl-row"><div>${dateLabel(q.from)}${q.to!==q.from?' – '+dateLabel(q.to):''}</div>${badge(q.status,q.status==='Pending'?'warn':'neutral')}</div>`).join('')}</div></section>`:''}`;}
function availability(p){return `${staffBack('me')}<div><h1>When I can’t work</h1><p class="cl-muted" style="margin-top:7px">Add a regular limit or a one-time block.</p></div><form class="cl-stack" data-form="availability"><label class="cl-field">How often?<select name="kind" data-av-kind><option value="weekly">Every week</option><option value="date">One date only</option></select></label><label class="cl-field" data-av-day>Day<select name="day">${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'].map((x,i)=>`<option value="${i}">${x}</option>`).join('')}</select></label><label class="cl-field" data-av-date hidden>Date<input name="date" type="date" value="2026-11-08"></label><div class="cl-formgrid"><label class="cl-field">From<input name="start" type="time" value="09:00" required></label><label class="cl-field">Until<input name="end" type="time" value="17:00" required></label></div><div class="cl-formerror" role="alert"></div>${button('Save unavailable time','submit','cl-primary')}</form><div class="cl-phonecard">${data.unavailable.filter(u=>u.staff===p.id).map(u=>`<div class="cl-row"><span class="cl-small">${u.kind==='weekly'?'Every '+['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][u.day]:dateLabel(u.date)}<br>${time(u.start)}–${u.end===1440?'midnight':time(u.end)}</span>${button('Remove','remove-av','cl-ghost','data-id="'+u.id+'"')}</div>`).join('')||empty('No limits added.')}</div><p class="cl-small cl-muted">New limits flag conflicts for your manager. Existing shifts are not automatically canceled.</p>`;}
function me(p){return `<div><h1>My account</h1><p class="cl-muted" style="margin-top:6px">${esc(p.name)}</p></div><div class="cl-phonecard">${[['details','contact-round','My contact info'],['availability','clock-3','When I can’t work'],['timeoff','sun','Time-off requests'],['calendar','calendar-plus','Calendar & phone']].map(([k,i,l])=>`<button type="button" class="cl-listbutton" data-staffpage="${k}"><span class="cl-icon">${icon(i)}${l}</span>${icon('chevron-right')}</button>`).join('')}</div><div class="cl-phonecard" style="padding:17px"><h3>Schedule emails</h3><p class="cl-small cl-muted" style="margin-top:7px">${data.notifications.updates?'Updates when your published shifts change.':'Shift-change emails are off.'}<br>${data.notifications.digest?'Weekly schedule: '+data.notifications.day+' at '+time(mins(data.notifications.time))+'.':'Weekly schedule emails are off.'}</p><p class="cl-small cl-muted" style="margin-top:9px">Sent to ${esc(p.email)}</p></div>`;}
function myDetails(p){return `${staffBack('me')}<div><h1>My contact info</h1><p class="cl-muted" style="margin-top:7px">Keep your manager in the loop.</p></div>${p.pendingEmail?`<div class="cl-note warn">Verification pending for ${esc(p.pendingEmail)}. Your current email stays active.</div>`:''}<form class="cl-stack" data-form="mydetails"><label class="cl-field">Full name<input name="name" value="${esc(p.name)}" required maxlength="60"></label><label class="cl-field">Email<input name="email" type="email" value="${esc(p.pendingEmail||p.email)}" required></label><label class="cl-field">Phone<input name="phone" type="tel" value="${esc(p.phone)}" autocomplete="tel"></label><div class="cl-formerror" role="alert"></div>${button('Save my info','submit','cl-primary')}<p class="cl-small cl-muted">Email changes require verification before becoming a sign-in address in the live service.</p></form>`;}
function calendarPage(p){return `${staffBack('me')}<div><h1>Calendar & phone</h1><p class="cl-muted" style="margin-top:7px">Your shifts, where you already look.</p></div><section class="cl-phonecard">${[['Google Calendar','google'],['iPhone / Apple Calendar','apple'],['Android calendar','android'],['Outlook / other calendar','outlook']].map(([l,id])=>`<button type="button" class="cl-listbutton" data-act="calendar-option" data-id="${id}"><span class="cl-icon">${icon('calendar-plus')}${l}</span>${icon('chevron-right')}</button>`).join('')}</section>${ui.edit?.startsWith('calendar-')?`<div class="cl-surface cl-stack"><h3>${esc({google:'Google Calendar',apple:'iPhone / Apple Calendar',android:'Android calendar',outlook:'Outlook / other calendar'}[ui.edit.slice(9)])}</h3><p class="cl-small cl-muted">Subscribe to a private calendar of your published shifts. Changes appear after your calendar app refreshes.</p>${button('Preview subscription setup','calendar-preview','cl-primary')}<p class="cl-small cl-muted">Connection preview only. No calendar account is connected.</p></div>`:''}<section class="cl-phonecard"><button type="button" class="cl-listbutton" data-act="phone-help"><span class="cl-icon">${icon('smartphone')}Add this site to my phone</span>${icon('chevron-right')}</button>${ui.edit==='phone'?'<div class="cl-small cl-muted" style="padding:4px 0 16px">iPhone: in Safari, tap Share, then Add to Home Screen.<br><br>Android: in Chrome, open the menu, then Add to Home screen.</div>':''}</section><p class="cl-small cl-muted">One-time calendar exports are snapshots. A subscription is best for changing shifts. Calendar updates are not instant; check this site for the latest times.</p>`;}
function staffOpen(p){const ss=data.publishedShifts.filter(s=>!s.staff&&eligible(p,s,data.publishedShifts).length===0);return `${staffBack()}<div><h1>Pick up a shift</h1><p class="cl-muted" style="margin-top:7px">Only shifts that fit your skills and availability.</p></div>${ss.map(s=>{const e=publishedEvent(s.event),req=data.requests.find(q=>q.kind==='shift'&&q.shift===s.id&&q.staff===p.id&&q.status==='Pending');return `<div class="cl-phonecard" style="padding:19px"><p class="cl-kicker">${dateLabel(e.date)}</p><h2 style="margin:7px 0">${range(s)}</h2><strong>${esc(e.name)}</strong><p class="cl-small cl-muted" style="margin:5px 0 15px">${esc(e.location)} · ${esc(shiftSkill(s))}</p>${req?badge('Request sent · awaiting manager','warn'):button('Request this shift','claim','cl-primary','data-id="'+s.id+'"')}</div>`}).join('')||`<div class="cl-phonecard">${empty('No matching open shifts right now.')}</div>`}<p class="cl-small cl-muted">Your manager approves requests before a shift is added to your schedule.</p>`;}
function coworkers(p){const es=data.publishedEvents.filter(e=>p.locations.includes(e.location));return `${staffBack('schedule')}<div><h1>Team schedule</h1><p class="cl-muted" style="margin-top:7px">Nov 2–8 · Your locations</p></div>${!data.notifications.coworkers?empty('Your manager has turned off team schedule visibility.'):es.map(e=>`<section class="cl-phonecard" style="padding:17px"><p class="cl-kicker">${dateLabel(e.date)}</p><h3 style="margin-top:6px">${esc(e.name)}</h3><p class="cl-small cl-muted">${esc(e.location)}</p>${data.publishedShifts.filter(s=>s.event===e.id).map(s=>`<div class="cl-row"><span class="cl-small">${range(s)}</span><strong class="cl-small">${s.staff&&person(s.staff).status==='Active'?esc(person(s.staff).name):'Open shift'}</strong></div>`).join('')}</section>`).join('')}`;}
function render(){app.innerHTML=ui.mode==='manager'?manager():staff();root.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===ui.mode)));if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});}
function error(form,msg){form.querySelector('.cl-formerror').textContent=msg;}
function submit(form){if(!form.reportValidity())return;const f=new FormData(form),v=n=>String(f.get(n)||'').trim(),kind=form.dataset.form;
if(ui.mode==='staff'&&person(ui.staffId).status!=='Active'){toast('This account has no website access.');render();return;}
if(kind==='shift'){
 const s=data.shifts.find(s=>s.id===form.dataset.id);let start=mins(v('start')),end=mins(v('end'));if(end<=start)end+=1440;const revised={...s,start,end,staff:v('staff')||null,dept:v('dept'),skill:v('skill')};
 if(end-start>16*60)return error(form,'A shift cannot exceed 16 hours. Check the start and end times.');
 if(revised.staff){const p=person(revised.staff),r=eligible(p,revised);if(r.length)return error(form,r.join(' · '));let total=hours(p)-(s.staff===p.id?(s.end-s.start)/60:0)+(end-start)/60;if(total>p.max)return error(form,`This would schedule ${hfmt(total)}h, above ${p.name}’s ${p.max}h weekly limit.`);}
 Object.assign(s,revised);ui.edit=null;mutate('Shift updated · '+event(s.event).name);return;
}
if(kind==='coverage'){
const e=event(form.dataset.id),phase=v('phase'),count=+v('count'),[start,end]=bounds(e,phase);for(let i=0;i<count;i++)data.shifts.push({id:'slot'+Date.now()+'-'+i,event:e.id,phase,start,end,dept:v('dept'),skill:v('skill'),staff:null});ui.edit=null;mutate('Added '+count+' open shifts · '+e.name);return;
}
if(kind==='settings'){const r={pre:+v('pre'),post:+v('post'),handover:+v('handover'),travel:+v('travel'),overlap:f.has('overlap')};if(r.post<r.handover)return error(form,'Post-event coverage must be at least as long as the handover.');data.rules=r;data.notifications={updates:f.has('updates'),digest:f.has('digest'),day:v('day'),time:v('time'),coworkers:f.has('coworkers')};mutate('Coverage rules and email preferences saved');return;}
if(kind==='location'||kind==='department'){const a=kind==='location'?data.locations:data.departments;if(!v('name'))return;if(a.some(x=>x.toLowerCase()===v('name').toLowerCase())){toast('That '+kind+' already exists.');return;}a.push(v('name'));mutate('Added '+kind+': '+v('name'));return;}
if(kind==='event'){
 const start=mins(v('start')),end=mins(v('end'));if(end<=start)return error(form,'Use an end time later than the start time for this same-day event.');if(start<data.rules.pre||end+Math.max(data.rules.post,data.rules.handover)>1440)return error(form,'Coverage extends beyond this day. Adjust the event times.');
 const e={id:'event'+Date.now(),name:v('name'),date:v('date'),start,end,location:v('location'),dept:v('dept'),skill:v('skill'),source:'Internal'};data.events.push(e);['pre','during','post'].forEach(phase=>{const [start,end]=bounds(e,phase);data.shifts.push({id:e.id+'-'+phase,event:e.id,phase,start,end,staff:null});});ui.detail={type:'event',id:e.id};mutate('Created Event · '+e.name);return;
}
if(kind==='profile'||kind==='newstaff'){
 let p=kind==='profile'?person(form.dataset.id):null;const locations=f.getAll('locations').map(String);if(!locations.length)return error(form,'Choose at least one location.');const email=v('email');if(data.staff.some(x=>x.id!==p?.id&&x.email.toLowerCase()===email.toLowerCase()))return error(form,'That email is already attached to a staff record.');
 const fields={email,phone:v('phone'),dept:v('dept'),skills:v('skills').split(',').map(x=>x.trim()).filter(Boolean),locations,max:kind==='profile'?+v('max'):28};if(p){Object.assign(p,fields);mutate('Updated '+p.name+'’s staff record');}else{p={id:'staff'+Date.now(),name:v('name'),status:'Active',notes:'',...fields};data.staff.push(p);ui.detail={type:'profile',id:p.id};mutate('Created staff record · '+p.name);}return;
}
if(kind==='timeoff'){
 if(v('to')<v('from'))return error(form,'The last day must be on or after the first day.');data.requests.push({id:'req'+Date.now(),staff:ui.staffId,from:v('from'),to:v('to'),note:v('note'),status:'Pending'});mutate('Time-off request submitted for manager review');return;
}
if(kind==='availability'){
 const start=mins(v('start')),end=mins(v('end'));if(end<=start)return error(form,'Choose an end time after the start. Use separate blocks for overnight limits.');data.unavailable.push({id:'av'+Date.now(),staff:ui.staffId,kind:v('kind'),day:+v('day'),date:v('date'),start,end});mutate('Availability updated · your manager can review conflicts');return;
}
if(kind==='mydetails'){
const p=person(ui.staffId),email=v('email');if(data.staff.some(x=>x.id!==p.id&&x.email.toLowerCase()===email.toLowerCase()))return error(form,'This email is already attached to a staff account.');p.pendingEmail=email.toLowerCase()!==p.email.toLowerCase()?email:null;p.name=v('name');p.phone=v('phone');mutate(p.pendingEmail?'Contact details saved · new email awaiting verification':'Contact details saved');return;
}
}
root.addEventListener('submit',e=>{const form=e.target.closest('form[data-form]');if(form){e.preventDefault();submit(form);}});
root.addEventListener('change',e=>{const t=e.target;if(t.dataset.filter){ui[t.dataset.filter]=t.value;ui.detail=null;ui.edit=null;render();persist();}if(t.hasAttribute('data-av-kind')){const form=t.closest('form');form.querySelector('[data-av-day]').hidden=t.value!=='weekly';form.querySelector('[data-av-date]').hidden=t.value!=='date';}});
root.addEventListener('click',e=>{
const b=e.target.closest('button');if(!b||b.disabled)return;const act=b.dataset.act,id=b.dataset.id;
if(b.dataset.mode){toast('');ui.mode=b.dataset.mode;ui.detail=null;ui.edit=null;render();persist();return;}
if(b.dataset.page){toast('');ui.page=b.dataset.page;ui.detail=null;ui.edit=null;render();persist();return;}
if(b.dataset.tab){ui.tab=b.dataset.tab;render();return;}
if(b.dataset.event){ui.detail={type:'event',id:b.dataset.event};ui.edit=null;render();return;}
if(b.dataset.person){ui.page='staff';ui.detail={type:'profile',id:b.dataset.person};ui.edit=null;render();return;}
if(b.dataset.staffpage){toast('');ui.staffPage=b.dataset.staffpage;ui.detail=null;ui.edit=null;render();persist();return;}
if(!act)return;
if(act==='submit'){submit(b.closest('form'));return;}
if(act==='back'){ui.detail=null;ui.edit=null;}
if(act==='new-event')ui.detail={type:'newEvent'};
if(act==='new-staff')ui.detail={type:'newStaff'};
if(act==='publish'){ui.emailType='update';ui.detail={type:'publish'};}
if(act==='preview-digest'){ui.emailType='digest';ui.detail={type:'publish'};}
if(act==='confirm-publish'){
 if(data.events.some(e=>issues(e).length)){toast('Resolve rule issues before publishing.');return;}
 data.published=true;data.publishedShifts=structuredClone(data.shifts);data.publishedEvents=structuredClone(data.events);data.dirty=false;data.outbox.unshift(`Preview created · ${active().length} active staff · ${data.notifications.updates?'update emails enabled':'update emails disabled'} · no email sent`);data.audit.unshift({text:'Published schedule preview',at:'Just now'});toast('Schedule published in this preview. No email was sent.');persist();
}
if(act==='add-coverage')ui.edit='newcoverage';
if(act==='edit-shift')ui.edit=ui.edit===id?null:id;
if(act==='assign-open'){const s=data.shifts.find(s=>s.id===id);ui.detail={type:'event',id:s.event};ui.edit=id;}
if(act==='unassign'){const s=data.shifts.find(s=>s.id===id);s.staff=null;ui.edit=null;mutate('Shift reopened · '+event(s.event).name);return;}
if(act==='fix-rules'){
 const e=event(id),ss=data.shifts.filter(s=>s.event===id);const before=structuredClone(ss);ss.forEach(s=>{[s.start,s.end]=bounds(e,s.phase);});let reason=ss.find(s=>s.staff&&eligible(person(s.staff),s).length);if(reason){before.forEach(old=>Object.assign(ss.find(s=>s.id===old.id),old));toast('Rule times would conflict with an assignment. Edit the affected shifts first.');render();return;}mutate('Applied coverage rule times · '+e.name);return;
}
if(act==='active-staff')ui.archive=false;
if(act==='archived-staff')ui.archive=true;
if(act==='termination')ui.edit='terminate';
if(act==='cancel-edit')ui.edit=null;
if(act==='confirm-termination'){
const p=person(id);p.status='Terminated';p.notes='Employment ended November 4, 2026. Historical records retained.';const count=data.shifts.filter(s=>s.staff===id).length;data.shifts.filter(s=>s.staff===id).forEach(s=>s.staff=null);data.requests.filter(q=>q.staff===id&&q.status==='Pending').forEach(q=>q.status='Closed');ui.edit=null;mutate(`Ended employment · ${p.name} · access revoked · ${count} future shifts reopened`);return;
}
if(act==='approve-request'||act==='decline-request'){
const q=data.requests.find(q=>q.id===id);if(person(q.staff).status!=='Active'){toast('This staff account is no longer active.');return;}q.status=act==='approve-request'?'Approved':'Declined';if(q.status==='Approved')data.shifts.filter(s=>s.staff===q.staff&&event(s.event).date>=q.from&&event(s.event).date<=q.to).forEach(s=>s.staff=null);mutate(`Time off ${q.status.toLowerCase()} · ${person(q.staff).name}`);return;
}
if(act==='approve-claim'){
const q=data.requests.find(q=>q.id===id),s=data.shifts.find(s=>s.id===q.shift),p=person(q.staff),r=eligible(p,s);if(s.staff||r.length||hours(p)+(s.end-s.start)/60>p.max){toast(s.staff?'This shift is already assigned.':r.join(' · ')||'Weekly hours limit would be exceeded.');return;}s.staff=p.id;q.status='Approved';data.requests.filter(x=>x.kind==='shift'&&x.shift===s.id&&x.id!==q.id&&x.status==='Pending').forEach(x=>x.status='Closed');mutate('Shift request approved · '+p.name);return;
}
if(act==='toggle-external'){data.external=!data.external;mutate(data.external?'External event context enabled':'External event context hidden');return;}
if(act==='staff-shift'){ui.staffPage='shift';ui.detail={id};}
if(act==='staff-calendar'){ui.staffPage='calendar';ui.edit=null;}
if(act==='staff-coworkers')ui.staffPage='coworkers';
if(act==='email-staff'){ui.mode='staff';ui.staffId='alex';ui.staffPage='schedule';ui.detail=null;}
if(act==='calendar-option')ui.edit='calendar-'+id;
if(act==='calendar-preview'){toast('Subscription setup preview: a private, revocable calendar feed of your published shifts. No calendar was connected.');}
if(act==='phone-help')ui.edit=ui.edit==='phone'?null:'phone';
if(act==='remove-av'){data.unavailable=data.unavailable.filter(u=>!(u.id===id&&u.staff===ui.staffId));mutate('Availability block removed');return;}
if(act==='claim'){
const s=data.shifts.find(s=>s.id===id),p=person(ui.staffId),pub=data.publishedShifts.find(s=>s.id===id);if(p.status!=='Active'||!pub||pub.staff||s.staff||eligible(p,s).length){toast('This shift is no longer available to request.');return;}if(hours(p)+(s.end-s.start)/60>p.max){toast('This shift would exceed your weekly hours limit.');return;}if(data.requests.some(q=>q.kind==='shift'&&q.shift===id&&q.staff===p.id&&q.status==='Pending'))return;data.requests.push({id:'claim'+Date.now(),kind:'shift',staff:p.id,shift:id,status:'Pending'});mutate('Shift requested · waiting for manager approval');return;
}
render();persist();
});
window.addEventListener('openai:set_globals',e=>{let s=e.detail?.globals?.widgetState?.privateContent;if(s?.version===3&&s.data){data=s.data;ui.mode=s.mode||ui.mode;render();}});
render();
if(globalThis.Tweak){const design={roomy:true};new Tweak({container:root,onChange:()=>{root.style.setProperty('--cl-radius',design.roomy?'14px':'8px');root.querySelectorAll('.cl-phonecard').forEach(el=>el.style.borderRadius=design.roomy?'17px':'9px');}}).addToggle(design,'roomy',{label:'Soft staff cards'});}
})();
</script>
